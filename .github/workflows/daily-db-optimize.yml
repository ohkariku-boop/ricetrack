name: Daily food library DB optimize

on:
  schedule:
    # 01:15 UTC every day — ANALYZE + index health
    - cron: "15 1 * * *"
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Run food_library optimize (indexes + ANALYZE)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Skip: set GitHub secrets APP_URL and CRON_SECRET"
            echo "  APP_URL=https://ricetrack.vercel.app"
            echo "  CRON_SECRET=<same value as Vercel CRON_SECRET>"
            exit 0
          fi
          BASE="${APP_URL%/}"
          echo "POST ${BASE}/api/library/optimize"
          RESP=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${BASE}/api/library/optimize")
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -n1)
          echo "HTTP $CODE"
          echo "$BODY" | head -c 2000
          echo
          if [ "$CODE" != "200" ]; then
            echo "Optimize endpoint returned $CODE"
            exit 1
          fi
