name: Daily food library DB optimize
on:
  schedule:
    # 01:15 UTC daily
    - cron: "15 1 * * *"
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: ANALYZE food_library indexes/stats
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skip: set GitHub secrets APP_URL and CRON_SECRET"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/library/optimize"
          echo
