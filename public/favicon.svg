<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rice" x1="18" y1="8" x2="46" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F0E0"/>
      <stop offset="0.45" stop-color="#E8D9B8"/>
      <stop offset="1" stop-color="#C4A574"/>
    </linearGradient>
    <linearGradient id="shade" x1="22" y1="12" x2="40" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- soft plate -->
  <circle cx="32" cy="32" r="30" fill="#2d5a3d"/>
  <!-- rice grain body -->
  <ellipse cx="32" cy="33" rx="11" ry="20" fill="url(#rice)" transform="rotate(-18 32 33)"/>
  <!-- highlight -->
  <ellipse cx="28" cy="26" rx="4.2" ry="9" fill="url(#shade)" transform="rotate(-18 28 26)"/>
  <!-- germ tip -->
  <ellipse cx="38.5" cy="17" rx="3.2" ry="4.5" fill="#F4EBD8" transform="rotate(-18 38.5 17)"/>
</svg>
