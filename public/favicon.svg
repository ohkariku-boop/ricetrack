<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rice" x1="20" y1="10" x2="44" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F1E4"/>
      <stop offset="0.5" stop-color="#E6D5B3"/>
      <stop offset="1" stop-color="#C4A574"/>
    </linearGradient>
    <linearGradient id="shine" x1="24" y1="16" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#2d5a3d"/>
  <!-- single rice grain -->
  <ellipse cx="32" cy="33" rx="10.5" ry="19.5" fill="url(#rice)" transform="rotate(-18 32 33)"/>
  <!-- soft highlight only (not a second grain) -->
  <ellipse cx="28.5" cy="27" rx="3.2" ry="8" fill="url(#shine)" transform="rotate(-18 28.5 27)"/>
</svg>
